<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine?</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">
    <div class="image-box">
        <img id="panda-img" class="character-img" src="" alt="Milk and Mocha Bear GIF">
    </div>
    
    <h2 id="question-text"></h2>

    <div id="action-area" class="buttons-container"></div>
</div>

<script>
    let step = 1;

    // Direct Working Tenor CDN GIF Links for Milk & Mocha
    const gifs = {
        step1: "https://media.tenor.com/gU21wNavAhMAAAAi/milk-and-mocha-bear.gif",
        step2: "https://media.tenor.com/zW-3gA--F9sAAAAi/milk-and-mocha.gif",
        step3: "https://media.tenor.com/b9LIXeUeS0AAAAAi/milk-and-mocha-hug.gif",
        step4: "https://media.tenor.com/j83uD3S0QYAAAAAi/milk-and-mocha-crying.gif",
        step5: "https://media.tenor.com/yG16_i0j_B4AAAAi/milk-and-mocha.gif",
        step6: "https://media.tenor.com/vHq13N2632sAAAAi/milk-and-mocha-bear-kiss.gif"
    };

    function renderStep() {
        const questionText = document.getElementById('question-text');
        const actionArea = document.getElementById('action-area');
        const pandaImg = document.getElementById('panda-img');

        if (step === 1) {
            questionText.innerText = "Will you be my girlfriend? 🥺❤️";
            pandaImg.src = gifs.step1;
            actionArea.innerHTML = `
                <div class="btn-row">
                    <button class="btn-yes" onclick="nextStep(true)">Yes 💚</button>
                    <button class="btn-no" onclick="nextStep(false)">No ❌</button>
                </div>
            `;
        } else if (step === 2) {
            questionText.innerText = "Are you sure? I love you so much! 🥺";
            pandaImg.src = gifs.step2;
            actionArea.innerHTML = `
                <div class="btn-row">
                    <button class="btn-yes" onclick="nextStep(true)">Yes 💚</button>
                    <button class="btn-yes" onclick="nextStep(true)">Yes 💚</button>
                </div>
                <button class="btn-no" style="width: 100%; opacity: 0.8;" onclick="nextStep(false)">Really sure? 🤨</button>
            `;
        } else if (step === 3) {
            questionText.innerText = "Please... let's write our beautiful story together 🌸";
            pandaImg.src = gifs.step3;
            actionArea.innerHTML = `
                <div class="btn-row">
                    <button class="btn-yes" onclick="nextStep(true)">Yes 💚</button>
                    <button class="btn-yes" onclick="nextStep(true)">Yes 💚</button>
                </div>
                <div class="btn-row">
                    <button class="btn-yes" onclick="nextStep(true)">Yes 💚</button>
                    <button class="btn-no" onclick="nextStep(false)">Still No? 😭</button>
                </div>
            `;
        } else if (step === 4) {
            questionText.innerText = "Don't give up! You have no other choice 🙃";
            pandaImg.src = gifs.step4;
            actionArea.innerHTML = `
                <div class="btn-row">
                    <button class="btn-yes" onclick="nextStep(true)">Yes 💚</button>
                    <button class="btn-yes" onclick="nextStep(true)">Yes 💚</button>
                </div>
                <div class="btn-row">
                    <button class="btn-yes" onclick="nextStep(true)">Yes 💚</button>
                    <button class="btn-yes" onclick="nextStep(true)">Yes 💚</button>
                </div>
                <button class="btn-surrender" onclick="nextStep(false)">Ufffff</button>
            `;
        } else if (step === 5) {
            questionText.innerText = "System Hacked! Only YES is available now 😎✨";
            pandaImg.src = gifs.step5;
            actionArea.innerHTML = `
                <div class="btn-row">
                    <button class="btn-yes" onclick="nextStep(true)">Yes 💚</button>
                    <button class="btn-yes" onclick="nextStep(true)">Yes 💚</button>
                </div>
                <div class="btn-row">
                    <button class="btn-yes" onclick="nextStep(true)">Yes 💚</button>
                    <button class="btn-yes" onclick="nextStep(true)">Yes 💚</button>
                </div>
                <button class="btn-yes" style="width: 100%; background: linear-gradient(135deg, #00b0ff 0%, #0081cb 100%);" onclick="nextStep(true)">I Surrender! 😍</button>
            `;
        } else if (step === 6) {
            questionText.innerText = "Yessssss! 🎉";
            pandaImg.src = gifs.step6;
            actionArea.innerHTML = `
                <p class="message-text">
                    You made the best decision ever! I promise to fill your life with love, laughter, and happiness.<br>
                    I love you more than everything! ✨💖😍
                </p>
                <button class="btn-restart" onclick="resetGame()">Play Again 🔄</button>
            `;
        }
    }

    function nextStep(isYes) {
        if (isYes) {
            step = 6;
        } else {
            step++;
            if (step > 5) step = 5;
        }
        renderStep();
    }

    function resetGame() {
        step = 1;
        renderStep();
    }

    renderStep();
</script>

</body>
</html>
